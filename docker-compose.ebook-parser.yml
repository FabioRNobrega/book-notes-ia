services:
  ebook-parser:
    build:
      context: ./services/EbookParseService.Api
      dockerfile: Dockerfile
    ports:
      - "${EBOOK_PARSER_PORT:-5082}:5082"
    environment:
      ASPNETCORE_URLS: http://+:5082
      EpubParser__InputDirectory: /data/input
      EpubParser__OutputDirectory: /data/output
    volumes:
      - ./services/EbookParseService.Api/data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:5082/health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
