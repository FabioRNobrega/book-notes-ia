services:
  chatterbox-tts:
    build:
      context: ./services/ChatterboxTtsService
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "${CHATTERBOX_PORT:-5081}:5081"
    volumes:
      - ./services/ChatterboxTtsService/data:/data
      - ./services/ChatterboxTtsService/models:/models
      - ./services/EbookParseService.Api/data/output:/books:ro
      - "${AUDIOBOOK_ROOT:-/home/deck/Music}:/audiobooks"
    environment:
      CHATTERBOX_DATA_DIR: /data
      CHATTERBOX_CONFIG_DIR: /app/config
      CHATTERBOX_DEVICE: cpu
      CHATTERBOX_MODEL: "${CHATTERBOX_MODEL:-v3}"
      CHATTERBOX_MODEL_REVISION: 5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18
      CHATTERBOX_NANO_MODEL_REVISION: 71ccd1d0081b430592cea481f4307e764e07bc64
      CHATTERBOX_SOURCE_REVISION: 5de7a54aa4e5e2baadb0182dde554908b48b85c2
      CHATTERBOX_PREVIEW_TIMEOUT_SECONDS: "${CHATTERBOX_PREVIEW_TIMEOUT_SECONDS:-604800}"
      CHATTERBOX_SEED: "${CHATTERBOX_SEED:-1234}"
      AUDIOBOOK_INPUT_ROOT: /books
      AUDIOBOOK_OUTPUT_ROOT: /audiobooks
      HF_HOME: /models/huggingface
      HF_HUB_CACHE: /models/huggingface/hub
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      HOME: /models
      PYTHONUNBUFFERED: "1"
      XDG_CACHE_HOME: /models/cache
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; data=json.load(urllib.request.urlopen('http://localhost:5081/health', timeout=5)); raise SystemExit(0 if data.get('model_ready') else 1)"
      interval: 10s
      timeout: 8s
      retries: 360
      start_period: 10s
